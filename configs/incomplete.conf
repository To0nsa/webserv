server {
    listen 8080;

    location /images {
        # Missing root directive → will be defaulted
        index photo.jpg;
        methods GET POST;
    }

    location /downloads {
        # Has redirect, but missing index/root → allowed
        return 301 /static/files/;
    }

    # Missing client_max_body_size, error_page → will be defaulted
}
