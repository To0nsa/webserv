server {
    listen 8080;
    host 0.0.0.0;
    server_name "example.com";

    error_page 404 /errors/404.html;
    client_max_body_size 4G;

    location / {
        root /home/nlouis/webserv/www/html;
        index index.html;
        autoindex off;
        methods GET POST;
    }

    location /uploads {
        root /home/nlouis/webserv/serverfiles/uploads;
        autoindex on;
        methods POST;
        upload_store /home/nlouis/webserv/serverfiles/uploads;
    }

	location /cgi-bin {
        root /home/nlouis/webserv/serverfiles/cgi-bin;
        methods GET POST;
        cgi_extension .py, .pl, .sh;
    }
}
