server {
    listen 8080;
    host 127.0.0.1;
    server_name example.com;

    error_page 404 /errors/404.html;
    client_max_body_size 1m;

    location / {
        root /var/www/html;
        index index.html;
        autoindex off;
        methods GET POST;
    }

    location /uploads {
        root /var/www/uploads;
        autoindex on;
        methods POST;
        upload_store /var/www/uploads;
    }
}
