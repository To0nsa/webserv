server {
    listen 8001;
    host 127.0.0.1;
    server_name example.com;

    error_page 404 /errors/404.html;
    client_max_body_size 100m;

    location / {
        root /home/irychkov/Desktop/webserv_team/serverfiles/html;
        index index.html;
        autoindex on;
        methods GET POST DELETE;
    }
	location /uploads {
        root /home/irychkov/Desktop/webserv_team/serverfiles/uploads;
        autoindex on;
        methods GET POST;
        upload_store /home/irychkov/Desktop/webserv_team/serverfiles/uploads;
    }
}
