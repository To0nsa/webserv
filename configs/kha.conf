server {
    listen 8001;
    host 127.0.0.1;
    server_name example.com;

    error_page 404 /errors/404.html;
    client_max_body_size 1m;

    location / {
        root /home/tdkha/hive/webserv/serverfiles/html;
        #root /Users/irychkov/Desktop/webserv_team/serverfiles/html;
        index index.html;
        autoindex on;
        methods GET POST DELETE;
    }
    location /a {
        root /home/tdkha/hive/webserv/serverfiles/html;
        #root /Users/irychkov/Desktop/webserv_team/serverfiles/html;
        #index index.html;
        autoindex on;
        methods GET POST;
    }
    location "//uploads" {
        root /home/tdkha/hive/webserv/serverfiles/uploads;
        autoindex on;
        methods POST;
        upload_store /home/tdkha/hive/webserv/serverfiles/uploads;
    }
}