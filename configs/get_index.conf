server {
    listen 8080;
    #host 127.0.0.1;
    server_name example.com;

    error_page 404 /errors/404.html;
    client_max_body_size 1m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        autoindex on;
        limit_except GET POST {
        deny all;
    	}
    }
	location /test {
        root /usr/share/nginx/html/;
        autoindex on;
        limit_except GET POST {
        deny all;
    	}
    }
}

