server {
    listen 8001;
    host 127.0.0.1;
    server_name example.com;

    error_page 404 /errors/404.html;
    client_max_body_size 100m;

    location / {
        root /Users/irychkov/Desktop/webserv_team/serverfiles/html;
        index index.html;
        autoindex on;
        methods GET POST DELETE;
    }
	location /uploads {
        root /Users/irychkov/Desktop/webserv_team/serverfiles/uploads;
        autoindex on;
        methods POST GET DELETE;
        upload_store /Users/irychkov/Desktop/webserv_team/serverfiles/uploads;
    }
    location /cgi-bin {
        root /Users/irychkov/Desktop/webserv_team/serverfiles/cgi-bin;
        methods GET POST;
        cgi_extension .py, .sh;
		cgi_interpreter .py /usr/bin/python3;
		cgi_interpreter .sh /bin/bash;
    }
}
