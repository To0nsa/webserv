server {
    listen 8080;
    server_name localhost;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    client_max_body_size 1M;

    location / {
        methods GET;
        root /home/nlouis/webserv/serverfiles/html;
        index index.html;
        autoindex on;
    }

    location /cgi-bin {
        methods GET POST;
        root /home/nlouis/webserv/serverfiles/cgi-bin;
        cgi_extension .py, .sh, .pl;

        cgi_interpreter .py /usr/bin/python3;
        cgi_interpreter .sh /bin/bash;
        cgi_interpreter .pl /usr/bin/perl;
    }
}

