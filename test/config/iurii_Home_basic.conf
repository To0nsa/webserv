server {
	host 127.0.0.1;
	listen 8080;
	server_name test-get;

	error_page 403 /error_403.html;
	error_page 404 /error_404.html;
	client_max_body_size 1M;

	location / {
		root /home/irychkov/Desktop/webserv/test/data;
		methods GET DELETE;
		index index.html;
		autoindex on;
	}

	location /dir {
		root /home/irychkov/Desktop/webserv/test/data/dir;
		methods GET DELETE;
		autoindex on;
	}

	location /forbidden/ {
		root /home/irychkov/Desktop/webserv/test/data/secret;
		methods GET;
		autoindex off;
		index index.html;
	}

	location /upload_store/ {
		root /home/irychkov/Desktop/webserv/test/data;
		methods GET POST DELETE;
		upload_store /home/irychkov/Desktop/webserv/test/data/upload_store;
		autoindex on;
	}

	location /with_index/ {
		root /home/irychkov/Desktop/webserv/test/data/with_index;
		methods GET DELETE;
		autoindex on;
		index index.html;
	}

	location /cgi-bin {
		root /home/irychkov/Desktop/webserv/test/data/cgi-bin;
		methods GET POST;
		cgi_extension .py, .sh;
		cgi_interpreter .py /usr/bin/python3;
		cgi_interpreter .sh /bin/bash;
		autoindex off;
	}

	location /all {
		root ./test/data/all;
		methods GET POST DELETE;
		upload_store /home/irychkov/Desktop/webserv/test/data/all/upload_store;
		autoindex on;
		index index.html;
		cgi_extension .py;
		cgi_interpreter .py /usr/bin/python3;
	}
}

server {
	host 127.0.0.1;
	listen 8081;
	server_name test-upload;

	error_page 403 /error_403.html;
	error_page 404 /error_404.html;
	client_max_body_size 2M;

	location /upload_store/ {
		root /home/irychkov/Desktop/webserv/test/data;
		methods GET POST DELETE;
		upload_store /home/irychkov/Desktop/webserv/test/data/upload_store_alt;
	}

	location / {
		root /home/irychkov/Desktop/webserv/test/data/upload_alt_root;
		methods GET;
		autoindex on;
		index index.html;
	}
}

server {
	host 127.0.0.2;
	listen 8080;
	server_name dads.com www.dads.com;

	client_max_body_size 30000000;

	# Routes
	location / {
		root ./test/oskari_www/www/;
		index index.html;
		methods GET POST;
		autoindex on;
	}

	location /uploads/ {
		root ./test/oskari_www/www/;
		upload_store ./test/oskari_www/www/;
		index index.html;
		methods GET POST;
		autoindex on;
	}

	location /oldDir/ {
		return 301 /newDir/;
	}

	location /imagesREDIR/ {
		return 307 /images/;
	}

	location /newDir/ {
		root ./test/oskari_www/www/images/;
		methods GET;
		autoindex on;
	}

	location /cgi/empty/ {
		return 307 https://www.google.com;
	}

	location /images/ {
		root ./test/oskari_www/www/images/;
		upload_store ./test/oskari_www/www/images/;
		methods GET POST DELETE;
		autoindex on;
	}
	
	location /ditto/ {
		return 302 /images/;
	}
	location /images/uploads/ {
		root ./test/oskari_www/www/uploads/;
		upload_store ./test/oskari_www/www/uploads/;
		methods GET POST DELETE;
		autoindex off;
	}
	location /cgi/ {
		root ./test/oskari_www/www/cgi;
		methods GET POST;
		cgi_extension .py;
		cgi_interpreter .py /usr/bin/python3;
		upload_store ./test/oskari_www/www/cgi/uploads/;
		autoindex off;
	}

	location /directory/ {
		root ./test/oskari_www/www/cgi/;
		methods POST GET;
		cgi_extension .py;
		cgi_interpreter .py /usr/bin/python3;
		index youpi.bad_extension;
		methods GET;
	}
}
