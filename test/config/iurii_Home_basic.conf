server {
	host 127.0.0.1;
	listen 8080;
	server_name test-get;

	error_page 403 /error_403.html;
	error_page 404 /error_404.html;
	client_max_body_size 1M;

	location / {
		root /home/irychkov/Desktop/webserv/test/data;
		methods GET DELETE;
		index index.html;
		autoindex on;
	}

	location /dir/ {
		root /home/irychkov/Desktop/webserv/test/data/dir;
		methods GET DELETE;
		autoindex on;
	}

	location /forbidden/ {
		root /home/irychkov/Desktop/webserv/test/data/secret;
		methods GET;
		autoindex off;
		index index.html;
	}

	location /dir {
		root /home/irychkov/Desktop/webserv/test/data;
		methods DELETE GET;
		return 301 /dir/;
	}

	location /upload_store/ {
		root /home/irychkov/Desktop/webserv/test/data;
		methods GET POST DELETE;
		upload_store /home/irychkov/Desktop/webserv/test/data/upload_store;
		autoindex on;
	}

	location /with_index/ {
		root /home/irychkov/Desktop/webserv/test/data/with_index;
		methods GET DELETE;
		autoindex on;
		index index.html;
	}

	location /cgi-bin {
		root /home/irychkov/Desktop/webserv/test/data/cgi-bin;
		methods GET POST;
		cgi_extension .py, .sh;
		cgi_interpreter .py /usr/bin/python3;
		cgi_interpreter .sh /bin/bash;
		autoindex off;
	}
}

server {
	host 127.0.0.1;
	listen 8081;
	server_name test-upload;

	error_page 403 /error_403.html;
	error_page 404 /error_404.html;
	client_max_body_size 2M;

	location /upload_store/ {
		root /home/irychkov/Desktop/webserv/test/data;
		methods GET POST DELETE;
		upload_store /home/irychkov/Desktop/webserv/test/data/upload_store_alt;
	}

	location / {
		root /home/irychkov/Desktop/webserv/test/data/upload_alt_root;
		methods GET;
		autoindex on;
		index index.html;
	}
}
