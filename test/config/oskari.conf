server {
	host 127.0.0.2;
	listen 8004;
	server_name dads.com www.dads.com;

	client_max_body_size 30000000;

	# Routes
	location / {
		root /home/irychkov/Desktop/webserv_team/test/oskari_www/www/;
		index index.html;
		methods GET POST;
		autoindex on;
	}

	location /uploads/ {
		root /home/irychkov/Desktop/webserv_team/test/oskari_www/www/;
		upload_store /home/irychkov/Desktop/webserv_team/test/oskari_www/www/;
		index index.html;
		methods GET POST;
		autoindex on;
	}

	location /oldDir/ {
		return 301 /newDir/;
	}

	location /imagesREDIR/ {
		return 307 /images/;
	}

	location /newDir/ {
		root /home/irychkov/Desktop/webserv_team/test/oskari_www/www/images/;
		methods GET;
		autoindex on;
	}

	location /cgi/empty/ {
		return 307 https://www.google.com;
	}

	location /images/ {
		root /home/irychkov/Desktop/webserv_team/test/oskari_www/www/images/;
		upload_store /home/irychkov/Desktop/webserv_team/test/oskari_www/www/images/;
		methods GET POST DELETE;
		autoindex on;
	}
	
	location /ditto/ {
		return 302 /images/;
	}
	location /images/uploads/ {
		root /home/irychkov/Desktop/webserv_team/test/oskari_www/www/uploads/;
		upload_store /home/irychkov/Desktop/webserv_team/test/oskari_www/www/uploads/;
		methods GET POST DELETE;
		autoindex off;
	}
	location /cgi/ {
		root /home/irychkov/Desktop/webserv_team/test/oskari_www/www/cgi;
		methods GET POST;
		cgi_extension .py;
		cgi_interpreter .py /usr/bin/python3;
		upload_store /home/irychkov/Desktop/webserv_team/test/oskari_www/www/cgi/uploads/;
		autoindex off;
	}

	location /directory/ {
		root /home/irychkov/Desktop/webserv_team/test/oskari_www/www/cgi/;
		methods POST GET;
		cgi_extension .py;
		cgi_interpreter .py /usr/bin/python3;
		index youpi.bad_extension;
		methods GET;
	}
}
