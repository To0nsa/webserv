# test/config/basic.conf

server {
	listen 8080;
	host 127.0.0.1;
	server_name test-get;

	error_page 403 /error_403.html;
	error_page 404 /error_404.html;

	client_max_body_size 1M;

	location / {
		root /home/toonsa/myProjects/webserv/test/data;
		methods GET DELETE;
		index index.html;
	}

	location /dir/ {
		root /home/toonsa/myProjects/webserv/test/data/dir;
		methods GET DELETE;
		autoindex on;
	}

	location /forbidden {
		root /home/toonsa/myProjects/webserv/test/data/secret;
		methods GET;
		autoindex off;
		index index.html;
	}

	location /dir {
		root /home/toonsa/myProjects/webserv/test/data;
		methods DELETE GET;
		return 301 /dir/;
	}

	location /upload_store/ {
		root /home/toonsa/myProjects/webserv/test/data;
		methods GET POST DELETE;
		upload_store /home/toonsa/myProjects/webserv/test/data/upload_store;
		autoindex on;
		#index index.html;
	}

	location /cgi-bin {
		root /home/toonsa/myProjects/webserv/test/data/cgi-bin;
		methods GET POST;
		cgi_extension .py, .sh;
		cgi_interpreter .py /usr/bin/python3;
		cgi_interpreter .sh /bin/bash;
		autoindex off;
	}
}
