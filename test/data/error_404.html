<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Not Found</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, #1f1f1f, #2b2b2b);
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 4rem;
      margin-bottom: 1rem;
      color: #ffa726;
    }
    p {
      font-size: 1.3rem;
      color: #cccccc;
      margin-bottom: 2rem;
    }
    a.button {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #4fc3f7;
      color: #1a1a1a;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
      transition: background 0.3s ease;
    }
    a.button:hover {
      background: #0288d1;
    }
    footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>404 Not Found</h1>
  <p>The requested resource could not be found on this server.</p>
  <a href="/" class="button">Return to Homepage</a>
  <footer>Powered by Webserv • C++20 • RFC-Compliant</footer>
</body>
</html>
