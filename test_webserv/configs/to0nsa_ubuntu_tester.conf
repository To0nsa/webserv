server {
    listen 8080;
    host 127.0.0.1;
    server_name example.com;

    client_max_body_size 100M;

    location / {
        root /home/toonsa/myProjects/webserv/test_webserv/serverfiles/html;
        index index.html;
        autoindex on;
        methods GET;
    }
	location /put_test/ {
        methods POST;
        upload_store /home/toonsa/myProjects/webserv/test_webserv/serverfiles/uploads;
    }
	location /cgi-bin {
        methods GET POST;
        root /home/toonsa/myProjects/webserv/test_webserv/serverfiles/cgi-bin;
        cgi_extension .bla;
		cgi_interpreter .bla /home/toonsa/myProjects/webserv/test_webserv/serverfiles/cgi-bin/ubuntu_cgi_tester;
    }
	location /post_body {
        upload_store /home/toonsa/myProjects/webserv/test_webserv/serverfiles/uploads;
        methods POST;
    }
	location /directory/ {
        root /home/toonsa/myProjects/webserv/test_webserv/serverfiles/html/YoupiBanane;
        index youpi.bad_extension;
        methods GET POST;
		cgi_extension .bla;
		cgi_interpreter .bla /home/toonsa/myProjects/webserv/test_webserv/serverfiles/cgi-bin/ubuntu_cgi_tester;
    }
}
